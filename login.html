
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MathLab Pro</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body class="dark">

    <div class="login-container fade-in">

        <h2>MathLab Pro</h2>

        <!-- LOGIN -->
        <div id="loginSection">

            <input type="email" id="email" placeholder="E-mail">

            <input type="password" id="password" placeholder="Senha">

            <button class="action" onclick="login()">Entrar</button>

            <p>
                <a href="#" onclick="mostrarRecuperacao(); return false;">
                    Esqueci minha senha
                </a>
            </p>

        </div>

        <!-- SOLICITAR RECUPERAÇÃO -->
        <div id="recoverySection" hidden>

            <h3>Recuperar senha</h3>

            <p>Informe seu e-mail cadastrado para receber o link de recuperação.</p>

            <input type="email" id="recoveryEmail" placeholder="Seu e-mail">

            <button class="action" onclick="recuperarSenha()">
                Enviar link de recuperação
            </button>

            <p>
                <a href="#" onclick="mostrarLogin(); return false;">
                    Voltar ao login
                </a>
            </p>

        </div>

        <!-- CADASTRAR NOVA SENHA -->
        <div id="newPasswordSection" hidden>

            <h3>Nova senha</h3>

            <input
                type="password"
                id="newPassword"
                placeholder="Digite sua nova senha"
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirme sua nova senha"
            >

            <button class="action" onclick="atualizarSenha()">
                Salvar nova senha
            </button>

        </div>

        <p id="loginError"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>

</body>
</html>
